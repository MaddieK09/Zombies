<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Zombies</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="rotate-screen">
        <h1>ROTATE DEVICE</h1>
        <p>This game is designed for landscape mode.</p>
    </div>

    <div id="game-container">

        <canvas id="game"></canvas>

        <div id="hud">

            <div id="round">
                ROUND <span id="round-number">1</span>
            </div>

            <div id="points">
                <span id="points-value">500</span>
            </div>

            <div id="ammo">
                <span id="mag-ammo">8</span>
                <span id="ammo-divider">/</span>
                <span id="reserve-ammo">32</span>
            </div>

        </div>

        <div id="crosshair">+</div>

        <div id="left-controls">
            <div id="move-stick">
                <div id="move-knob"></div>
            </div>
        </div>

        <div id="right-controls">

            <button
                id="reload-button"
                type="button"
                aria-label="Reload weapon"
            >
                RELOAD
            </button>

            <button
                id="fire-button"
                type="button"
                aria-label="Fire weapon"
            >
                FIRE
            </button>

        </div>

        <div id="interaction-prompt" hidden>
            INTERACT
        </div>

        <div id="game-error" hidden></div>

    </div>


    <!-- THREE.JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
    ></script>


    <!-- GLTF / GLB MODEL LOADER -->
    <script
        src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"
    ></script>


    <!-- GAME -->
    <script src="game.js?v=316"></script>

</body>

</html>
